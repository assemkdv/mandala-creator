<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala Creator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Mandala Creator</h1>
            <p class="subtitle">Draw symmetrical patterns</p>
        </header>

        <div class="main-content">
            <div class="controls-panel">

                <div class="control-group">
                    <label for="segments" class="control-label">Segments</label>
                    <input type="range" id="segments" min="2" max="24" value="8" class="slider">
                    <span class="value-display" id="segmentsValue">8</span>
                </div>

            </div>

            <div class="canvas-container">
                <canvas id="mandalaCanvas"></canvas>
                <div class="canvas-overlay">
                    <div class="center-dot"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
